name: Release

# 仅在父仓库 NetworkKits 打 v* tag 时触发；
# 此时 checkout 会把子模块锁定到该 tag 提交所记录的具体 commit。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1) 前端静态文件
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 按 repos.json 检出子仓库指定 tag
        shell: bash
        run: |
          set -e
          for dir in NetworkComponentWeb NetworkComponent NetworkComponentWPF; do
            tag=$(jq -r ".[\"$dir\"] // empty" repos.json)
            if [ -n "$tag" ]; then
              echo "$dir -> $tag"
              git -C "$dir" fetch --tags --force origin
              git -C "$dir" checkout -f "$tag"
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web dist
        working-directory: NetworkComponentWeb
        run: |
          npm ci
          npm run build
      - name: Zip dist
        working-directory: NetworkComponentWeb
        run: zip -r ../web-dist.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.zip

  # 2) 后端 Linux 自包含
  backend-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 按 repos.json 检出子仓库指定 tag
        shell: bash
        run: |
          set -e
          for dir in NetworkComponentWeb NetworkComponent NetworkComponentWPF; do
            tag=$(jq -r ".[\"$dir\"] // empty" repos.json)
            if [ -n "$tag" ]; then
              echo "$dir -> $tag"
              git -C "$dir" fetch --tags --force origin
              git -C "$dir" checkout -f "$tag"
            fi
          done
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish backend (linux-x64)
        working-directory: NetworkComponent
        run: dotnet publish NetworkComponent/NetworkComponent.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o publish-linux
      - name: Tar linux output
        working-directory: NetworkComponent
        run: tar czf ../backend-linux-x64.tar.gz -C publish-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: backend-linux-x64.tar.gz

  # 3) 后端 Windows 自包含
  backend-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 按 repos.json 检出子仓库指定 tag
        shell: bash
        run: |
          set -e
          for dir in NetworkComponentWeb NetworkComponent NetworkComponentWPF; do
            tag=$(jq -r ".[\"$dir\"] // empty" repos.json)
            if [ -n "$tag" ]; then
              echo "$dir -> $tag"
              git -C "$dir" fetch --tags --force origin
              git -C "$dir" checkout -f "$tag"
            fi
          done
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish backend (win-x64)
        working-directory: NetworkComponent
        run: dotnet publish NetworkComponent/NetworkComponent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish-win
      - name: Zip win output
        working-directory: NetworkComponent
        shell: pwsh
        run: Compress-Archive -Path publish-win\* -DestinationPath ..\backend-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: backend-win
          path: backend-win-x64.zip

  # 4) WPF 桌面壳（Windows-only；其 csproj 会自动先构建前端、发布后端、再把 dist 拷入 wwwroot）
  wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 按 repos.json 检出子仓库指定 tag
        shell: bash
        run: |
          set -e
          for dir in NetworkComponentWeb NetworkComponent NetworkComponentWPF; do
            tag=$(jq -r ".[\"$dir\"] // empty" repos.json)
            if [ -n "$tag" ]; then
              echo "$dir -> $tag"
              git -C "$dir" fetch --tags --force origin
              git -C "$dir" checkout -f "$tag"
            fi
          done
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies（csproj 构建时会自动 npm run build，必须先装依赖）
        working-directory: NetworkComponentWeb
        run: npm ci
      - name: Publish WPF
        working-directory: NetworkComponentWPF/NetworkComponentWPF
        run: dotnet publish NetworkComponentWPF.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Zip WPF output
        working-directory: NetworkComponentWPF/NetworkComponentWPF
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ..\..\NetworkComponentWPF-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: wpf
          path: NetworkComponentWPF-win-x64.zip

  # 5) 汇总为 GitHub Release
  release:
    needs: [web, backend-linux, backend-win, wpf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true